{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#ffffff"/>

<style>
  .pub-venue,
  a.pub-venue,
  a.pub-venue:hover,
  a.pub-venue:focus,
  a.pub-venue:active,
  a.pub-venue:visited {
    color: #0047ab;
  }
  html[data-theme="dark"] .pub-venue,
  html[data-theme="dark"] a.pub-venue,
  html[data-theme="dark"] a.pub-venue:hover,
  html[data-theme="dark"] a.pub-venue:focus,
  html[data-theme="dark"] a.pub-venue:active,
  html[data-theme="dark"] a.pub-venue:visited {
    color: #8eb6ff;
  }

  a,
  a:hover,
  a:focus,
  a:active,
  a:visited {
    text-decoration: none !important;
    border-bottom: none !important;
  }

  h1, h2, h3, h4, h5, h6,
  .page__title,
  .archive__item-title,
  .archive__subtitle,
  .page__content h2,
  .masthead__menu-item a,
  .masthead__menu-item.selected a,
  .masthead__menu-item.selected a:hover,
  u,
  ins,
  abbr {
    text-decoration: none !important;
    border-bottom: none !important;
  }

  /* Publication titles, including [n], match the author/citation size. */
  .page__content .archive__item-title {
    font-size: 1em;
  }

  .page__title.pub-entry-title {
    font-size: smaller;
  }

  .pub-cite {
    padding-left: 2em;
  }

  /* Wrapped title lines align with the title text, not under [n]. */
  h1.pub-entry-title,
  h2.pub-entry-title {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: 0.35em;
    align-items: start;
  }
</style>

<!-- end custom head snippets -->
